[package]
name = "sextant"
description = "Sextant — desktop Kubernetes client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
default-run = "sextant"

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "sextant_lib"
# Only the rlib the binary links. "staticlib" and "cdylib" (the Tauri template's mobile outputs: iOS and Android) made
# every release build run a second whole-program fat LTO in this crate and write a ~0.5 GB static library that nothing
# uses. A mobile build (#17) would add them back.
crate-type = ["rlib"]

[[bin]]
name = "sextant"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
sextant-core.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener = "2.7"
# Desktop notifications about new cluster problems (`src/features/notifications/`); a click on one is reported back
# (`on_action` in `lib.rs` reveals the window, the page opens the object).
tauri-plugin-notification = "2.7"
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
# The MCP tool `apply_yaml` reads the documents (as the core does) to check the agent's rights before applying.
serde_yaml.workspace = true
ts-rs.workspace = true
portable-pty.workspace = true
base64.workspace = true
# Saved Argo CD logins in the OS credential store: Keychain (macOS), Credential Manager (Windows), Secret Service
# over D-Bus (Linux; libdbus is already linked by tao), encrypted with pure-Rust crypto.
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Built-in MCP server for AI agents: Streamable HTTP (sessions, SSE) on 127.0.0.1, tools declared with `#[tool]`.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
# The HTTP server under rmcp's `StreamableHttpService` (a tower service): routing, Host/Origin/token checks, body limit.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
# JSON Schema of tool arguments (`#[derive(JsonSchema)]`); the same major version rmcp uses.
schemars = "1.2.2"
# `CancellationToken` that stops rmcp's server and its sessions.
tokio-util = "0.7.20"
# The MCP token: 32 bytes from the OS random source.
getrandom = "0.3.4"
# Config and data directories for `sextant mcp`, which runs without Tauri; the same crate and rule Tauri uses.
dirs = "7.0.0"
# Downloading extension packages from GitHub Releases. TLS by rustls with the ring provider (as the updater does,
# `rustls::crypto::ring::default_provider()`), OS root certificates through rustls-platform-verifier; no aws-lc.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# SHA-256 of the downloaded Flux / Argo CD install.yaml (checked against Flux's checksums file, shown in the preview);
# the same crate the core uses.
sha2.workspace = true
# The font families installed on the computer (Settings -> Appearance, `commands/fonts.rs`): the web view cannot list
# them. Pure Rust (MIT): reads the system font folders (fontconfig's config parsed, not run); no process is started.
fontdb = "0.24"

# In-app updates (desktop only): checks and installs signed releases; `process` relaunches after installing.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
# One Sextant per user: a second launch brings the running window back and exits (`lib.rs` `with_single_instance`).
tauri-plugin-single-instance = "2.5"

# The tray icon is shown on Linux only by a StatusNotifier host: `tray::available` asks the session bus whether one
# is there (the same libdbus as keyring).
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
# The StatusNotifier item takes its name from GLib's application name (libappindicator reads it), else the program
# name is shown: `tray.rs` sets "Sextant". The version GTK already uses, so no new crate.
glib = "0.18"
# Without a StatusNotifier host libayatana falls back to an XEmbed icon: `tray.rs` asks the X server whether a tray
# owns `_NET_SYSTEM_TRAY_S<screen>`. libX11 is loaded at run time; the version tao already uses, so no new crate.
x11-dl = "2.21"
# Caps glibc's malloc arenas at start (`malloc.rs`); the version the lockfile already has, so no new crate.
libc = "0.2"

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true
