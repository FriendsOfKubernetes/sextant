# A tag `v*` (e.g. v0.2.0) builds the installers on Linux x86_64 and arm64 (.deb, .rpm, .AppImage), macOS
# (universal .dmg) and Windows (.msi, and a portable .zip for Scoop) and publishes them as a GitHub Release with
# generated notes. Installers are not code-signed.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must equal the version in the manifests (`node scripts/check-version.mjs --tag <tag>`), or nothing is built.
#
# In-app updates: `bundle.createUpdaterArtifacts` makes the build sign the AppImage, the macOS .app.tar.gz and the
# .msi with the updater key (secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD; the public
# half is `plugins.updater.pubkey` in src-tauri/tauri.conf.json). tauri-action uploads the .sig files and, while the
# release is a draft, merges every platform into the release asset `latest.json`; the publish job
# (`node scripts/packaging.mjs latest-json`) checks every entry against the release's assets, takes every signature
# from the .sig assets, rebuilds the entries that build jobs finishing together overwrote from the assets and their
# .sig, fails only when a required platform has no signed asset, puts the release notes into it and only then
# publishes. The notes list the closed issues of the milestone named like the tag (v0.2.0). A rebuild of an older
# tag does not become the "latest" release. Installed apps read
# https://github.com/<repo>/releases/latest/download/latest.json, so an update reaches them once it is published.
#
# To rebuild the release of an already pushed tag without moving it: Actions -> Release -> Run workflow, input `tag`.
# Prefer running the tag's own workflow: gh workflow run release.yml --ref vX.Y.Z -f tag=vX.Y.Z (its jobs, scripts and
# checks are the ones the tag was released with). Run from main for an older tag, this workflow builds what that
# checkout knows: a tag without scripts/packaging.mjs (before ADR-0104) is built as it was then — no arm64 row, no
# .rpm, no portable zip, no package-manager manifests, and the publish job requires only linux-x86_64, darwin-x86_64,
# darwin-aarch64 and windows-x86_64. The publish job's own script always comes from this workflow's commit.
# A rebuild of an already published release does not let the build jobs touch its latest.json (they would put
# stale darwin signatures into it): the publish job refreshes the published one and swaps it in under a temporary
# name, so installed apps never find the release without a manifest.
#
# With `dry_run` checked the run builds and signs everything for that tag the same way but creates, changes and
# publishes no release: the bundles become workflow artifacts (bundles-<os>) instead. Running one from main shortly
# before pushing a tag also warms the caches the tag's build restores (see "Caches" below). A dry run for a tag that
# does not exist yet builds the commit it was started from (the version there must equal the tag), so a workflow
# change can be tried before tagging: gh workflow run release.yml --ref main -f tag=v<next> -f dry_run=true
#
# macOS: the universal app is no longer compiled in one job (both architectures one after the other). Two jobs build
# the aarch64 and x86_64 binaries in parallel (`tauri build --target <triple> --no-bundle`), and a third joins them
# with `lipo` into target/universal-apple-darwin/release/sextant — exactly what `tauri build --target
# universal-apple-darwin` does — and runs only the bundle step on it (`tauri bundle`, which compiles nothing and signs
# the updater archive like `tauri build`). Same .dmg, Sextant_universal.app.tar.gz(.sig) and latest.json entries.
#
# Linux arm64 is built natively on GitHub's arm64 runner (ubuntu-22.04-arm, the same glibc baseline as the x86_64
# job): .deb, .rpm and the AppImage, and the latest.json entries linux-aarch64(-appimage/-deb/-rpm).
#
# Package managers (ADR-0104): after the release is published, the `packages` job renders the Homebrew cask, the
# Scoop manifest and the winget manifests from packaging/ with the SHA-256 that GitHub computed for the published
# assets (scripts/packaging.mjs) and keeps them as the workflow artifact packages-<tag>. Each outward step runs only
# when its secret exists, and none of them can fail the release (it is already published):
#   TAP_GITHUB_TOKEN    -> commits Casks/sextant.rb to FriendsOfKubernetes/homebrew-sextant
#   BUCKET_GITHUB_TOKEN -> commits bucket/sextant.json to FriendsOfKubernetes/scoop-sextant
#   WINGET_GITHUB_TOKEN -> wingetcreate (a pinned release, its SHA-256 checked) opens a pull request with the
#                          manifests in microsoft/winget-pkgs
# Only a release that became "latest" with a plain vX.Y.Z tag goes to package managers. A dry run renders the
# manifests from its own bundles (the artifact) and sends nothing anywhere.
#
# Caches: Swatinem/rust-cache (the target directory, one key per OS / target).
# A run can restore only caches written by its own ref or by the default branch (main); pull requests, forks
# included, write only into their own refs/pull/<n>/merge scope, so nothing a pull request builds reaches a release.
# A tag build only reads (rust-cache save-if): the next tag could not restore it anyway, and it would only push
# main's entries out of the repository's cache quota. Runs on main (dispatched rebuilds and dry runs) write.
# No sccache: with the dependencies restored by rust-cache it got no hits (the workspace crates change with every tag
# and the binary is not cacheable), failed many writes, and its per-crate entries pushed the repository over the
# 10 GB cache quota, which evicts the release caches that only tags read (least recently used first).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release for, e.g. v0.1.0
        required: true
        type: string
      dry_run:
        description: Build and sign everything, but create and publish no release (bundles become workflow artifacts)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create the release (draft)
    runs-on: ubuntu-latest
    outputs:
      # What every job checks out: the tag, or (a dry run for a tag not pushed yet) the commit the run started from.
      ref: ${{ steps.ref.outputs.ref }}
      release-id: ${{ steps.create.outputs.release-id }}
      # "true" when the release was already published (a rebuild): then only the publish job writes latest.json.
      published: ${{ steps.create.outputs.published }}
      # "true" when the checkout has ADR-0104's layout (scripts/packaging.mjs): arm64, .rpm, the portable zip and the
      # package-manager manifests. An older tag rebuilt by this workflow is built as it was then.
      packaging: ${{ steps.layout.outputs.packaging }}
    steps:
      - name: Choose the commit to build
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>gh-error.txt; then
            ref="refs/tags/$TAG"
          elif [ "$DRY_RUN" = true ] && grep -qF "(HTTP 404)" gh-error.txt; then
            ref="$GITHUB_SHA"
            echo "::notice::Tag $TAG does not exist yet: this dry run builds $GITHUB_REF_NAME at $GITHUB_SHA"
          else
            cat gh-error.txt
            echo "::error::Tag $TAG does not exist in $GITHUB_REPOSITORY (or could not be read)"
            exit 1
          fi
          echo "Building $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Check that the tag equals the version in the manifests
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-version.mjs --tag "$TAG"
      - name: Tell which release layout the checkout has
        id: layout
        run: |
          if [ -f scripts/packaging.mjs ]; then
            packaging=true
          else
            packaging=false
            echo "::notice::This checkout predates ADR-0104: no arm64, .rpm, portable zip or package-manager manifests"
          fi
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"
      # A dry run touches no release: release-id and published stay empty.
      - name: Find or create the draft release and output its id
        if: ${{ !inputs.dry_run }}
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Id of the (draft or published) release of $TAG, or empty if there is none. The list is read
          # into a variable first so that `head` closing the pipe cannot fail `gh` under pipefail.
          find_release() {
            local ids
            ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.TAG) | .id')
            printf '%s\n' "$ids" | sed -n '1p'
          }

          # The tag must already exist: a draft release does not create it.
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent \
            || { echo "::error::Tag $TAG does not exist in $GITHUB_REPOSITORY"; exit 1; }

          # The closed issues of the milestone named like the tag (v0.2.0), as a Markdown list; empty without one.
          closed_issues() {
            local number
            number=$(gh api --paginate "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" \
              --jq '.[] | select(.title == env.TAG) | .number')
            number=$(printf '%s\n' "$number" | sed -n '1p')
            if [ -z "$number" ]; then
              echo "::warning::No milestone $TAG: the release notes list no closed issues" >&2
              return 0
            fi
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/issues?milestone=$number&state=closed&sort=created&direction=asc&per_page=100" \
              --jq '.[] | select((.pull_request | not) and .state_reason != "not_planned") | "- \(.title) (#\(.number))"'
          }
          issues_heading="## Closed issues"
          issues=$(closed_issues)
          issues_section=""
          [ -n "$issues" ] && issues_section=$(printf '%s\n\n%s\n' "$issues_heading" "$issues")

          id=""
          for attempt in 1 2 3; do
            id=$(find_release)
            [ -n "$id" ] && break
            [ "$attempt" -lt 3 ] && sleep 5
          done

          if [ -z "$id" ]; then
            echo "No release for $TAG yet, creating a draft"
            notes="Installers for Linux x86_64 and arm64 (.deb, .rpm, .AppImage), macOS (universal .dmg) and Windows (.msi, or the portable .zip). They are not code-signed — see [Installing](https://github.com/$GITHUB_REPOSITORY/wiki/Installation) for how to open them on macOS and Windows. Sextant 0.2.0 and later installed from the AppImage, .dmg or .msi (also through Homebrew or winget) update themselves (Settings → Updates); a .deb or .rpm and the portable .zip (Scoop) are updated by the package manager."
            [ -n "$issues_section" ] && notes=$(printf '%s\n\n%s' "$notes" "$issues_section")
            # The id comes straight from the creation response, not from the (possibly lagging) list.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Sextant $TAG" -f body="$notes" \
              -F draft=true -F generate_release_notes=true --jq '.id')
          else
            echo "Found existing release $id for $TAG"
            # Made before the milestone was closed (or by hand): add the list once.
            body=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '.body // ""')
            if [ -n "$issues_section" ] && ! grep -qxF "$issues_heading" <<<"$body"; then
              echo "Adding the closed issues of milestone $TAG to the release notes"
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
                -f body="$(printf '%s\n\n%s' "$body" "$issues_section")" --silent
            fi
          fi

          if ! [[ "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine the release id for $TAG (got '$id')"
            exit 1
          fi
          echo "Release id: $id"
          echo "release-id=$id" >> "$GITHUB_OUTPUT"

          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '.draft')
          case "$draft" in
            true) published=false ;;
            false) published=true ;;
            *)
              echo "::error::Could not read whether release $id is a draft (got '$draft')"
              exit 1
              ;;
          esac
          echo "Release already published: $published"
          echo "published=$published" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            # A checkout from before ADR-0104 has no rpm dependencies configured: built as it was then.
            legacy-args: --bundles deb,appimage
            bundles: |
              target/release/bundle/deb/*.deb*
              target/release/bundle/rpm/*.rpm*
              target/release/bundle/appimage/*.AppImage*
          # Native arm64 (GitHub's arm64 runners are free for public repositories); tauri-action names its latest.json
          # entries after the host: linux-aarch64, linux-aarch64-appimage, -deb, -rpm.
          - name: linux-arm64
            os: ubuntu-22.04-arm
            args: --bundles deb,rpm,appimage
            bundles: |
              target/release/bundle/deb/*.deb*
              target/release/bundle/rpm/*.rpm*
              target/release/bundle/appimage/*.AppImage*
          - name: windows
            os: windows-latest
            args: --bundles msi
            bundles: |
              target/release/bundle/msi/*.msi*
              target/release/bundle/portable/*.zip
    runs-on: ${{ matrix.os }}
    env:
      # The arm64 row builds only a checkout with ADR-0104's layout; on an older tag its steps are skipped.
      BUILD: ${{ matrix.name != 'linux-arm64' || needs.create-release.outputs.packaging == 'true' }}
      PACKAGING: ${{ needs.create-release.outputs.packaging }}
    steps:
      - name: Skip the arm64 row (a tag from before ADR-0104)
        if: env.BUILD != 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "::notice::$TAG predates the linux-arm64 builds of ADR-0104; nothing is built here"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.BUILD == 'true'
        with:
          ref: ${{ needs.create-release.outputs.ref }}

      - name: Install Linux system dependencies
        if: env.BUILD == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file patchelf

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: env.BUILD == 'true'
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch head on 2026-10-12)
        if: env.BUILD == 'true'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.BUILD == 'true'
        with:
          key: release-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install npm packages
        if: env.BUILD == 'true'
        run: npm ci

      - name: Build installers and upload them to the release
        if: env.BUILD == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (bundle.createUpdaterArtifacts); without the key the build fails.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # A dry run passes neither: tauri-action then builds and signs but uploads nothing.
          releaseId: ${{ !inputs.dry_run && needs.create-release.outputs.release-id || '' }}
          # Only names the tag in the download URLs of latest.json (a draft's asset URLs are "untagged-…").
          tagName: ${{ !inputs.dry_run && (inputs.tag || github.ref_name) || '' }}
          args: ${{ env.PACKAGING != 'true' && matrix.legacy-args || matrix.args }}
          # The .sig files are uploaded either way. A draft: add this platform to the release asset latest.json.
          # A published release (a rebuild): leave its latest.json, which installed apps read, to the publish job;
          # tauri-action would keep the old darwin entries and re-upload it with stale signatures.
          includeUpdaterJson: ${{ needs.create-release.outputs.published != 'true' }}
          updaterJsonPreferNsis: false
          retryAttempts: 2

      # Scoop installs this zip (ADR-0104). The bundler patches the bundle kind into the executable it packs and puts
      # the plain one back, so target/release/sextant.exe says "no bundle": a Scoop copy is updated by Scoop and never
      # runs the .msi updater into Program Files. If check-unbundled ever finds it patched, no zip is made (a
      # warning): the release goes out without it and the packages job leaves the Scoop manifest out. A checkout
      # from before ADR-0104 has no scripts/packaging.mjs and gets no zip.
      - name: Pack the portable zip (Windows)
        id: pack
        if: matrix.name == 'windows' && env.PACKAGING == 'true' && hashFiles('scripts/packaging.mjs') != ''
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/packaging.mjs check-unbundled target/release/sextant.exe
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::target/release/sextant.exe is patched for an installer: no portable zip for $env:TAG, so Scoop is not updated"
            exit 0
          }
          $version = $env:TAG.Substring(1)
          New-Item -ItemType Directory -Force -Path target/release/bundle/portable | Out-Null
          $zip = "target/release/bundle/portable/Sextant_${version}_x64_portable.zip"
          Remove-Item -Force -ErrorAction SilentlyContinue $zip
          Compress-Archive -Path target/release/sextant.exe -DestinationPath $zip
          Get-Item $zip | Format-List Name, Length
          "packed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Like tauri-action's uploads: a rebuild replaces the asset of the same name.
      - name: Upload the portable zip to the release (Windows)
        if: ${{ matrix.name == 'windows' && !inputs.dry_run && steps.pack.outputs.packed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/releases"
          name="Sextant_${TAG#v}_x64_portable.zip"
          old=$(gh api "$api/$RELEASE_ID/assets?per_page=100" --jq ".[] | select(.name == \"$name\") | .id")
          if [ -n "$old" ]; then
            gh api -X DELETE "$api/assets/$old" --silent
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@target/release/bundle/portable/$name" \
            "https://uploads.github.com/$api/$RELEASE_ID/assets?name=$name" -o uploaded.json
          id=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("uploaded.json", "utf8")).id ?? "")')
          if ! [[ "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not upload $name (got id '$id')"
            exit 1
          fi
          echo "Uploaded $name as asset $id"

      - name: Keep the bundles as a workflow artifact (dry run)
        if: ${{ inputs.dry_run && env.BUILD == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # The two halves of the universal macOS app, in parallel. No secrets here: nothing is signed until the bundle step.
  build-macos-binary:
    name: Build (macos, ${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.create-release.outputs.ref }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch head on 2026-10-12)
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install npm packages
        run: npm ci

      # The same compile `tauri build` runs (beforeBuildCommand builds the frontend, the release profile, the
      # tauri/custom-protocol feature), without bundling.
      - name: Build the ${{ matrix.target }} binary
        env:
          TARGET: ${{ matrix.target }}
        run: npm run tauri -- build --target "$TARGET" --no-bundle --ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/sextant
          if-no-files-found: error
          # A re-run of the bundle job alone needs them; after that the arch jobs have to be re-run too.
          retention-days: 3
          overwrite: true

  build-macos:
    name: Build (macos)
    needs: [create-release, build-macos-binary]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.create-release.outputs.ref }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      # Only for `cargo metadata --no-deps`, which the Tauri CLI reads the target directory from.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch head on 2026-10-12)

      - name: Install npm packages
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-binary-*
          path: ${{ runner.temp }}/macos-binaries

      # What `tauri build --target universal-apple-darwin` does after compiling both targets.
      - name: Join both binaries into the universal one
        env:
          BINARIES: ${{ runner.temp }}/macos-binaries
        run: |
          set -euo pipefail
          out=target/universal-apple-darwin/release
          mkdir -p "$out"
          lipo -create -output "$out/sextant" \
            "$BINARIES/macos-binary-aarch64-apple-darwin/sextant" \
            "$BINARIES/macos-binary-x86_64-apple-darwin/sextant"
          chmod +x "$out/sextant"
          lipo "$out/sextant" -verify_arch arm64 x86_64
          lipo -info "$out/sextant"

      # tauri-action always runs `<tauriScript> build <args>`; this script turns that into `tauri bundle <args>`, which
      # takes the binary above as it is (it compiles nothing) and signs the updater archive like `tauri build`.
      - name: Make tauri-action bundle instead of build
        run: |
          cat > "$RUNNER_TEMP/tauri-bundle.mjs" <<'SCRIPT'
          import { spawnSync } from 'node:child_process';
          import { resolve } from 'node:path';
          const [command, ...args] = process.argv.slice(2);
          if (command !== 'build') {
            console.error(`tauri-bundle.mjs: expected "build", got "${command}"`);
            process.exit(2);
          }
          const result = spawnSync(resolve('node_modules/.bin/tauri'), ['bundle', ...args], { stdio: 'inherit' });
          process.exit(result.status ?? 1);
          SCRIPT

      - name: Bundle the universal app and upload it to the release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (bundle.createUpdaterArtifacts); without the key the bundle step fails.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: node ${{ runner.temp }}/tauri-bundle.mjs
          releaseId: ${{ !inputs.dry_run && needs.create-release.outputs.release-id || '' }}
          tagName: ${{ !inputs.dry_run && (inputs.tag || github.ref_name) || '' }}
          args: --target universal-apple-darwin --bundles app,dmg
          # See the build job: a rebuild of a published release leaves latest.json to the publish job.
          includeUpdaterJson: ${{ needs.create-release.outputs.published != 'true' }}
          updaterJsonPreferNsis: false
          retryAttempts: 2

      - name: Keep the bundles as a workflow artifact (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-macos
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Publish the release
    needs: [create-release, build, build-macos]
    # A dry run publishes nothing.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    outputs:
      # "true" when this release became the latest one (then package managers may get it).
      latest: ${{ steps.publish.outputs.latest }}
    steps:
      # The script of this workflow's own commit (the tag's for a tag push, the branch head for a dispatched run), so a
      # rebuild of an older tag from main still runs the checks this file describes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # The build jobs of a draft merge latest.json one after another and may overwrite each other when they finish
      # together; an update manifest without a platform would leave that platform without updates. A rebuild of a
      # published release re-uploads the bundles and their .sig files but not latest.json, and tauri-action keeps the
      # darwin entries of an old latest.json anyway ("don't overwrite native builds"). So `latest-json` checks every
      # entry against the release's assets, takes every signature again from the .sig asset of the file its url
      # names, rebuilds every entry an asset gives but latest.json lacks from that asset and its .sig (url: the
      # tagged download URL, as tauri-action writes it), and fails only when a required platform has no signed asset
      # (full: both Linux arches with -deb/-rpm, macOS, Windows; legacy, a tag from before ADR-0104: the four
      # platforms it always had). tauri-action writes no notes into it: they come from the release body. The new
      # manifest goes up as latest.json.new, the old asset is deleted and the new one renamed, so a published release
      # is without latest.json only between two API calls.
      - name: Check latest.json, refresh its signatures and put the release notes into it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          PUBLISHED: ${{ needs.create-release.outputs.published }}
          PLATFORMS: ${{ needs.create-release.outputs.packaging == 'true' && 'full' || 'legacy' }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/releases"

          gh api --paginate "$api/$RELEASE_ID/assets?per_page=100" --jq '.[]' | jq -s . > assets.json
          find_asset() { jq -r --arg n "$1" '.[] | select(.name == $n) | .id' assets.json; }

          # Every .sig asset, for the signatures (names checked before they become file names).
          mkdir -p sigs
          while read -r id name; do
            [ -n "$id" ] || continue
            if ! [[ "$id" =~ ^[0-9]+$ && "$name" =~ ^[A-Za-z0-9._+-]+\.sig$ ]]; then
              echo "::error::Unexpected signature asset '$name' ($id)"
              exit 1
            fi
            gh api -H "Accept: application/octet-stream" "$api/assets/$id" > "sigs/$name"
          done < <(jq -r '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' assets.json)

          # A run that stopped between deleting latest.json and renaming its replacement left only latest.json.new:
          # then that one is the manifest to start from. Without either, latest-json builds it from the assets.
          asset_id=$(find_asset latest.json)
          leftover_id=$(find_asset latest.json.new)
          source_id=${asset_id:-$leftover_id}
          rm -f latest.json
          if [ -n "$source_id" ]; then
            gh api -H "Accept: application/octet-stream" "$api/assets/$source_id" > latest.json
          fi

          # The notes from the release body; a rebuild also dates the manifest by its new bundles.
          gh api "$api/$RELEASE_ID" --jq '.body // ""' > notes.md
          node scripts/packaging.mjs latest-json --tag "$TAG" --repo "$GITHUB_REPOSITORY" --assets assets.json \
            --sigs sigs --manifest latest.json --platforms "$PLATFORMS" --notes notes.md --published "$PUBLISHED" \
            --out latest.new.json

          # Upload under a temporary name, delete the old asset, rename the new one (asset names are unique within
          # a release, so the old one has to go first). A leftover latest.json.new of a stopped run is replaced.
          if [ -n "$leftover_id" ]; then
            gh api -X DELETE "$api/assets/$leftover_id" --silent
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @latest.new.json \
            "https://uploads.github.com/$api/$RELEASE_ID/assets?name=latest.json.new" > uploaded.json
          new_id=$(jq -r '.id // ""' uploaded.json)
          if ! [[ "$new_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not upload latest.json.new (got id '$new_id')"
            exit 1
          fi
          if [ -n "$asset_id" ]; then
            gh api -X DELETE "$api/assets/$asset_id" --silent
          fi
          renamed=false
          for attempt in 1 2 3 4 5; do
            if gh api -X PATCH "$api/assets/$new_id" -f name=latest.json --silent; then
              renamed=true
              break
            fi
            echo "Renaming latest.json.new failed (attempt $attempt), retrying"
            sleep 2
          done
          if [ "$renamed" != true ]; then
            echo "::error::The release has latest.json.new but no latest.json: re-run this job, it takes latest.json.new up again"
            exit 1
          fi

      # Installed apps update from the "latest" release: a rebuild of an older tag must not take that place.
      - name: Publish (no longer a draft; latest only if no newer release is)
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # The tag of the current latest release; none (404) before the first one. Any other failure stops here:
          # on an error gh prints the error's JSON to stdout, which must never pass for a tag.
          if current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>gh-error.txt); then
            if ! [[ "$current" =~ ^v[0-9] ]]; then
              echo "::error::The latest release has an unexpected tag: '$current'"
              exit 1
            fi
          elif grep -qF "(HTTP 404)" gh-error.txt; then
            current=""
          else
            cat gh-error.txt
            echo "::error::Could not read the latest release"
            exit 1
          fi
          # Version order: `sort -V` with the pre-release dash as `~`, so v0.2.0-rc.1 is older than v0.2.0.
          order_key() { printf '%s\n' "$1" | sed 's/^v//; s/-/~/'; }
          newest=$(printf '%s\n%s\n' "$(order_key "${current:-$TAG}")" "$(order_key "$TAG")" | sort -V | tail -n 1)
          if [ "$newest" = "$(order_key "$TAG")" ]; then make_latest=true; else make_latest=false; fi
          echo "Latest release now: ${current:-none}; $TAG becomes latest: $make_latest"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest="$make_latest" --silent
          echo "latest=$make_latest" >> "$GITHUB_OUTPUT"

  # Homebrew, Scoop and winget manifests of this release (ADR-0104). Renders them from the published release (the
  # checksums are GitHub's digests of the published assets) or, in a dry run, from the bundles the run built, and
  # keeps them as the artifact packages-<tag>. Each push to a package manager needs its own secret and is skipped
  # without it; every outward step is continue-on-error, so a package manager can never fail the release.
  packages:
    name: Package-manager manifests
    needs: [create-release, build, build-macos, publish]
    # A tag from before ADR-0104 has no templates, no portable zip and no packaging script: nothing to render.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.build-macos.result == 'success'
      && (inputs.dry_run || needs.publish.result == 'success') && needs.create-release.outputs.packaging == 'true' }}
    runs-on: ubuntu-latest
    # Reads the release; the pushes use their own tokens (secrets), never this one.
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      # "true" when this release goes to the package managers: published, latest, and a plain vX.Y.Z tag.
      ship: ${{ steps.render.outputs.ship }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.create-release.outputs.ref }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Download the bundles of this run (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: ${{ runner.temp }}/bundles

      - name: Render the manifests
        id: render
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          LATEST: ${{ needs.publish.outputs.latest }}
          BUNDLES: ${{ runner.temp }}/bundles
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/packages"
          if [ "$DRY_RUN" = true ]; then
            node scripts/packaging.mjs render --tag "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$BUNDLES" --out "$out"
            ship=false
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
            node scripts/packaging.mjs render --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
              --release "$RUNNER_TEMP/release.json" --out "$out"
            ship=false
            if [ "$LATEST" = true ] && [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then ship=true; fi
          fi
          # Without the portable zip (the Windows job skipped it) there is no Scoop manifest to push.
          scoop=false
          if [ -f "$out/scoop/bucket/sextant.json" ]; then scoop=true; fi
          echo "Package managers get $TAG: $ship (Scoop: $scoop)"
          echo "ship=$ship" >> "$GITHUB_OUTPUT"
          echo "scoop=$scoop" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ inputs.tag || github.ref_name }}
          path: ${{ runner.temp }}/packages
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Update the Homebrew tap
        if: ${{ steps.render.outputs.ship == 'true' }}
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          REPO: FriendsOfKubernetes/homebrew-sextant
          SOURCE: ${{ runner.temp }}/packages/homebrew/Casks/sextant.rb
          TARGET: Casks/sextant.rb
        run: bash packaging/push-manifest.sh

      - name: Update the Scoop bucket
        if: ${{ steps.render.outputs.ship == 'true' && steps.render.outputs.scoop == 'true' }}
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BUCKET_GITHUB_TOKEN }}
          REPO: FriendsOfKubernetes/scoop-sextant
          SOURCE: ${{ runner.temp }}/packages/scoop/bucket/sextant.json
          TARGET: bucket/sextant.json
        run: bash packaging/push-manifest.sh

  # winget-pkgs takes pull requests only; wingetcreate opens one from a fork of the token's account. The package's
  # first version is submitted by hand (ADR-0104, "Outward steps"); afterwards this job keeps it current.
  winget:
    name: Submit to winget
    needs: [packages]
    if: ${{ !cancelled() && needs.packages.outputs.ship == 'true' }}
    runs-on: windows-latest
    continue-on-error: true
    # The pull request is opened with WINGET_GITHUB_TOKEN; this job needs nothing of the workflow's token.
    permissions: {}
    env:
      # A pinned wingetcreate (https://github.com/microsoft/winget-create/releases/tag/v1.12.13.0). The SHA-256 is the
      # one Microsoft publishes beside the asset (wingetcreate.exe.txt) and GitHub's digest of wingetcreate.exe; a
      # newer release is taken by changing both lines from that release's page.
      WINGETCREATE_URL: https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe
      WINGETCREATE_SHA256: 24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ inputs.tag || github.ref_name }}
          path: ${{ runner.temp }}/packages

      - name: Open the winget-pkgs pull request
        shell: pwsh
        env:
          # wingetcreate reads the token from this variable, so it never appears on a command line.
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PACKAGES: ${{ runner.temp }}/packages
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) { Write-Output "No WINGET_GITHUB_TOKEN: skipped"; exit 0 }
          $version = $env:TAG.Substring(1)
          $manifests = Join-Path $env:PACKAGES "winget/manifests/f/FriendsOfKubernetes/Sextant/$version"
          Invoke-WebRequest -Uri $env:WINGETCREATE_URL -OutFile wingetcreate.exe
          $hash = (Get-FileHash -Algorithm SHA256 wingetcreate.exe).Hash
          if ($hash -ne $env:WINGETCREATE_SHA256) {
            Write-Output "::error::wingetcreate.exe has SHA-256 $hash, expected $env:WINGETCREATE_SHA256: not run"
            exit 1
          }
          .\wingetcreate.exe submit --no-open --prtitle "New version: FriendsOfKubernetes.Sextant version $version" $manifests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
