# A tag `v*` (e.g. v0.1.0) builds the installers on Linux (.deb, .AppImage), macOS (universal .dmg) and Windows
# (.msi) and publishes them as a GitHub Release with generated notes. Installers are not code-signed.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create the release (draft)
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.release-id }}
    steps:
      - uses: actions/checkout@v5
      - name: Create a draft release with generated notes
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          find_release() {
            gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1
          }
          id=$(find_release)
          if [ -z "$id" ]; then
            gh release create "$TAG" --draft --verify-tag --title "Sextant $TAG" --generate-notes \
              --notes "Installers for Linux (.deb, .AppImage), macOS (universal .dmg) and Windows (.msi). They are not code-signed — see [Installing](https://github.com/$GITHUB_REPOSITORY#installing) for how to open them on macOS and Windows."
            id=$(find_release)
          fi
          test -n "$id"
          echo "release-id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: --bundles deb,appimage
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - name: windows
            os: windows-latest
            args: --bundles msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS app needs both architectures.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install npm packages
        run: npm ci

      - name: Build installers and upload them to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish the release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish (no longer a draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
