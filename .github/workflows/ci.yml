# Every push and pull request to main: the full check (`npm run check` — rustfmt, clippy, cargo tests,
# TypeScript bindings, tsc, eslint, vitest) on Linux, macOS and Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # rust-cache keeps the target directory (the dependencies) in the GitHub Actions cache. A pull request (from a
      # fork too) writes only into its own refs/pull/<n>/merge scope; main's caches are written only by pushes to main.
      # No sccache: rust-cache already restores every dependency and the workspace crates change on every push, so it
      # got no hits, failed most of its writes and its per-crate entries pushed the repository over the 10 GB cache
      # quota, evicting the release caches. Incremental builds are not cached (rust-cache sets this too); without debug
      # info the test binaries, their links and the cached target directory are much smaller.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      # Keep LF line endings on Windows: rustfmt and the generated-bindings check compare files byte for byte.
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install npm packages
        run: npm ci

      # The app crate embeds the built frontend (`dist/`), so it must exist before cargo builds it.
      - name: Build the frontend
        run: npm run build

      - name: npm run check
        run: npm run check
