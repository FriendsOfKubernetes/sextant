# Every push and pull request to main: the full check (`npm run check` — rustfmt, clippy, cargo tests,
# TypeScript bindings, tsc, eslint, vitest) on Linux, macOS and Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # sccache keeps compiler outputs in the GitHub Actions cache next to rust-cache's target directory. A pull
      # request (from a fork too) writes only into its own refs/pull/<n>/merge scope; main's caches are written only
      # by pushes to main, and release.yml restores nothing else.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # sccache cannot cache incremental builds (rust-cache sets this too); without debug info the test binaries,
      # their links and the cached target directory are much smaller.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      # Keep LF line endings on Windows: rustfmt and the generated-bindings check compare files byte for byte.
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@v2

      - name: Install npm packages
        run: npm ci

      # The app crate embeds the built frontend (`dist/`), so it must exist before cargo builds it.
      - name: Build the frontend
        run: npm run build

      - name: npm run check
        run: npm run check
