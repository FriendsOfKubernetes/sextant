[package]
name = "sextant-core"
description = "Kubernetes cluster access for Sextant: kubeconfig, connections, watch, actions, logs, exec, port-forward, metrics, Helm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["desktop"]
# Everything that spawns OS processes (the `helm` binary). Mobile builds turn it off.
desktop = []

[dependencies]
kube.workspace = true
k8s-openapi.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
ts-rs.workspace = true
flate2.workspace = true
base64.workspace = true
tempfile.workspace = true
sha2.workspace = true
# The connection's own retry policy (`cluster::RetryPolicy`) plugs into kube's client stack; same versions as kube-client.
tower = { version = "0.5.3", default-features = false, features = ["retry", "buffer"] }
http = "1.5"
# Argo CD API client (`argocd.rs`) over a local port forward: the HTTP/TLS stack kube already brings, ring only.
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
