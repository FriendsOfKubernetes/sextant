[package]
name = "sextant-core"
description = "Kubernetes cluster access for Sextant: kubeconfig, connections, watch, actions, logs, exec, port-forward, metrics, Helm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["desktop"]
# Everything that spawns OS processes (the `helm` binary). Mobile builds turn it off.
desktop = []

[dependencies]
kube.workspace = true
k8s-openapi.workspace = true
tokio.workspace = true
futures.workspace = true
# `rc`: watch batches share the stored objects (`Arc<Value>`) instead of deep-copying them.
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
serde_yaml.workspace = true
ts-rs.workspace = true
flate2.workspace = true
base64.workspace = true
tempfile.workspace = true
sha2.workspace = true
# The connection's own retry policy (`cluster::RetryPolicy`) plugs into kube's client stack; same versions as kube-client.
tower = { version = "0.5.3", default-features = false, features = ["retry", "buffer"] }
http = "1.5"
# Argo CD API client (`argocd.rs`) over a local port forward: the HTTP/TLS stack kube already brings, ring only.
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "client-legacy"] }
http-body-util = "0.1.5"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12"] }
# Extension packages (`extensions::package`): reading `.zip` / `.sextant-ext` archives. Deflate through flate2 with the
# zlib-rs backend the build already has; no other compression methods, no encryption.
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Signals without spawning `kill`: the liveness check of a temporary kubeconfig's owner (`kubeconfig.rs`) and stopping
# a timed-out cloud CLI's whole process group (`cloud.rs`); `fs`: the `openat` walk that serves extension files without
# following links (`extensions::package`). Already in the tree through tempfile.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "process", "fs"] }

# Job objects for cloud CLIs (`cloud.rs`), the liveness check of a temporary kubeconfig's owner (`kubeconfig.rs`), and
# file identity, link count and final path of served extension files (`extensions::package`).
# The version tempfile already brings.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
