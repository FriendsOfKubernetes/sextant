[workspace]
members = ["crates/sextant-core", "crates/sextant-ext-runtime", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.25.5"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/FriendsOfKubernetes/sextant"

[workspace.dependencies]
sextant-core = { path = "crates/sextant-core" }
kube = { version = "4.2", default-features = false, features = ["client", "config", "runtime", "ws", "rustls-tls", "ring", "gzip", "http-proxy", "socks5"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["latest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
ts-rs = { version = "12", features = ["serde-json-impl"] }
portable-pty = "0.9"
flate2 = "1"
base64 = "0.23"
tempfile = "3"
sha2 = "0.11"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Extension backends (ADR-0131): an unoptimized Cranelift needs half a minute to compile a TypeScript backend (its
# JavaScript engine is 12 MB of WebAssembly); the compiler itself is optimized in debug builds and tests.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-bforest]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
[profile.dev.package.cranelift-assembler-x64]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2
[profile.dev.package.wasmtime-environ]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
