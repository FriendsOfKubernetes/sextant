# ts-rs writes TypeScript bindings here when `cargo test` runs the generated `export_bindings_*` tests.
# `npm run gen:types` copies them into src/api/generated; `npm run check` compares the two.
[env]
TS_RS_EXPORT_DIR = { value = "target/ts-bindings", relative = true }
# serde_json writes i64 as a JSON number, so the TypeScript side must see `number`, not `bigint`.
TS_RS_LARGE_INT = "number"
