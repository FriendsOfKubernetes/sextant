apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello
  namespace: sextant-demo
spec:
  schedule: "*/30 * * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: hello
              image: busybox:stable
              command: ["sh", "-c", "date; echo hello from sextant"]
