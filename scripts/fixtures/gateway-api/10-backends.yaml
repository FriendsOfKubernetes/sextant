# Backend Services and Deployments of the Gateway API fixtures (tiny nginx pods; every Service listens on the
# port the routes refer to and forwards it to nginx's port 80). Generated once, edit by hand if needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: gw-shop
  labels: {app: web, sextant.dev/fixture: gateway-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: app
          image: nginx:stable-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: gw-shop
  labels: {app: web, sextant.dev/fixture: gateway-api}
spec:
  selector: {app: web}
  ports:
    - name: main
      port: 80
      targetPort: 80
---
